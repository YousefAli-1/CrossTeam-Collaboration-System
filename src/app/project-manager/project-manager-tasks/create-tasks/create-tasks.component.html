<form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
  <label for="taskName">Task Name</label>
  <input id="taskName" formControlName="taskName" type="text" required>

  <label for="description">Description</label>
  <textarea id="description" formControlName="description"></textarea>

  <label for="deadline">Deadline</label>
  <input id="deadline" type="date" formControlName="deadline">

  <label for="projectId">Select Project</label>
  <select id="projectId" formControlName="projectId">
    <option *ngFor="let project of projects" [value]="project.projectId">
      {{ project.projectName }}
    </option>
  </select>

  <label for="teamId">Select Team</label>
  <select id="teamId" formControlName="teamId">
    <option *ngFor="let team of teams" [value]="team.teamId">
      {{ team.teamName }}
    </option>
  </select>

  <button type="submit">Create Task</button>
  <button type="button" (click)="onCancel()">Cancel</button>
</form>
